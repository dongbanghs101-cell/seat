<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>교실 자리 배치 (Copy)</title>
<style>
:root{
  --pp:#8b5cf6; --pp2:#a855f7; --pp-d:#6d28d9;
  --ink:#1e293b; --mut:#64748b; --line:#e4e4e7;
  --sw:86px; --sh:64px; --sf:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Noto Sans KR','Pretendard','Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;color:var(--ink);background:#faf7ff;
}
button{font-family:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes popIn{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes cdIn{0%{opacity:0;transform:scale(2.4)}30%{opacity:1;transform:scale(1)}100%{opacity:.85;transform:scale(.92)}}
@keyframes ring{0%{transform:scale(.85);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- 시작 화면 ---------- */
.landing{min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2 50%,#f093fb);display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.11)}
.blob.b1{top:8%;left:8%;width:110px;height:110px;animation:float 6s ease-in-out infinite}
.blob.b2{top:58%;right:10%;width:160px;height:160px;animation:float 8s ease-in-out infinite}
.blob.b3{bottom:14%;left:18%;width:80px;height:80px;animation:float 5s ease-in-out infinite}
.land-in{text-align:center;z-index:1;animation:fadeUp .8s ease;max-width:760px}
.logo-circle{width:128px;height:128px;background:rgba(255,255,255,.95);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:float 4s ease-in-out infinite}
.logo-circle span{font-size:64px}
.land-in h1{font-size:clamp(34px,8vw,60px);font-weight:900;color:#fff;letter-spacing:-1px;text-shadow:0 4px 30px rgba(0,0,0,.3)}
.tag{font-size:clamp(15px,3vw,20px);color:rgba(255,255,255,.88);margin:12px 0 36px}
.feats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:38px}
.feat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:13px;padding:12px 16px;display:flex;align-items:center;gap:7px;color:#fff;font-size:13px;font-weight:600;animation:slideIn .5s ease both}
.cta{padding:20px 52px;font-size:18px;font-weight:800;background:#fff;border:none;border-radius:100px;color:#7c3aed;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.22);animation:pulse 2.4s ease-in-out infinite}
.quick-load{margin-top:34px}
.quick-load p{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:10px}
.qrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.qrow button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:13px;font-weight:600;padding:9px 18px;border-radius:100px;cursor:pointer}
.ver{margin-top:40px;font-size:12px;color:rgba(255,255,255,.55)}

/* ---------- 레이아웃 ---------- */
.app{min-height:100vh;background:linear-gradient(135deg,#fdf4ff,#faf5ff 25%,#f0f9ff 50%,#f0fdf4 75%,#fefce8);padding:32px 16px 60px;position:relative;overflow-x:hidden}
.bg{position:absolute;pointer-events:none;border-radius:50%}
.bg.b1{top:-110px;right:-110px;width:400px;height:400px;background:radial-gradient(circle,rgba(196,181,253,.3),transparent 70%)}
.bg.b2{bottom:-110px;left:-110px;width:360px;height:360px;background:radial-gradient(circle,rgba(167,243,208,.3),transparent 70%)}
.wrap{max-width:1400px;margin:0 auto;position:relative;z-index:1}
.app-head{text-align:center;margin-bottom:26px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border:1px solid rgba(139,92,246,.2);border-radius:100px;padding:7px 18px;margin-bottom:14px;cursor:pointer;font-size:13px;font-weight:700;color:#7c3aed}
.app-head h1{font-size:clamp(28px,5vw,40px);font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6 50%,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.app-head p{font-size:14px;color:var(--mut);margin-top:8px}
.stepper{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:28px}
.sdot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:rgba(255,255,255,.85);color:#a1a1aa;border:2px solid var(--line)}
.sdot.on{background:linear-gradient(135deg,var(--pp),var(--pp2));color:#fff;border:none;box-shadow:0 4px 15px rgba(139,92,246,.34)}
.sbar{width:46px;height:3px;background:var(--line);border-radius:2px}
.sbar.on{background:linear-gradient(90deg,var(--pp),var(--pp2))}
footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid rgba(139,92,246,.12);font-size:12px;color:#a1a1aa}

.card{background:rgba(255,255,255,.9);border:1px solid rgba(139,92,246,.15);border-radius:22px;padding:clamp(18px,3vw,34px);box-shadow:0 20px 60px rgba(139,92,246,.1)}
.ch{font-size:20px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:11px}
.ch-sub{font-size:14px;color:var(--mut);margin-bottom:22px}
.cico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.cico.p{background:linear-gradient(135deg,#c4b5fd,#ddd6fe)}
.cico.c{background:linear-gradient(135deg,#a5f3fc,#99f6e4)}

/* ---------- 폼 ---------- */
.field{margin-bottom:18px}
.field>label{display:block;font-size:12px;font-weight:700;color:#6366f1;margin-bottom:7px}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px}
.inp{width:100%;padding:13px 15px;font-size:15px;font-weight:500;background:#faf5ff;border:2px solid #e9d5ff;border-radius:11px;color:var(--ink);box-sizing:border-box}
.inp.sm{padding:9px 12px;font-size:13px;margin-bottom:8px}
.inp.ta{min-height:150px;line-height:1.9;resize:vertical;font-size:14px}
select.inp{cursor:pointer}
.inp:focus{border-color:var(--pp2);box-shadow:0 0 0 4px rgba(168,85,247,.12);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:8px}
.inline{display:flex;gap:8px}
.inline .inp{flex:1}

.btn{padding:12px 18px;font-size:14px;font-weight:700;border:none;border-radius:11px;cursor:pointer;color:#fff;transition:transform .12s,filter .12s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:9px 15px;font-size:12.5px}
.btn.big{padding:17px;font-size:16px}
.btn.full{width:100%}
.btn.grow{flex:2}
.btn.tall{padding:16px 20px}
.btn.mt{margin-top:10px}
.btn.primary{background:linear-gradient(135deg,var(--pp),var(--pp2));box-shadow:0 8px 26px rgba(139,92,246,.35)}
.btn.ok{background:linear-gradient(135deg,#10b981,#059669)}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.btn.info{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.btn.pink{background:linear-gradient(135deg,#ec4899,#db2777)}
.btn.danger{background:#ef4444}
.btn.ghost{background:#fff;border:2px solid var(--line);color:#71717a}
.row-btn{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.link{background:none;border:none;color:#6366f1;text-decoration:underline;cursor:pointer;font-size:12px;margin-left:6px}

.toggles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.toggle{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.toggle.on{border-color:#a5b4fc;background:#f5f3ff}
.toggle .knob{width:38px;height:22px;border-radius:20px;background:#d4d4d8;position:relative;flex:none;transition:background .18s}
.toggle .knob:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s}
.toggle.on .knob{background:var(--pp)}
.toggle.on .knob:after{transform:translateX(16px)}
.toggle .tl strong{display:block;font-size:13px;color:var(--ink)}
.toggle .tl em{display:block;font-size:11px;color:var(--mut);font-style:normal;margin-top:2px}

/* ---------- 패널 / 칩 ---------- */
.panel{border-radius:15px;padding:17px;margin-bottom:13px;border:1px solid}
.panel h3{font-size:14px;font-weight:700;margin-bottom:4px}
.panel p{font-size:12px;color:var(--mut)}
.panel.v{background:linear-gradient(135deg,#faf5ff,#f5f3ff);border-color:#e9d5ff}
.panel.v h3{color:#7c3aed}
.panel.g{background:linear-gradient(135deg,#f8fafc,#f1f5f9);border-color:#e2e8f0}
.panel.gr{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#86efac}
.panel.gr h3{color:#16a34a}
.panel.b{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#93c5fd}
.panel.b h3{color:#1d4ed8}
.panel.y{background:linear-gradient(135deg,#fefce8,#fef3c7);border-color:#fcd34d}
.panel.y h3{color:#b45309}
.panel.pk{background:linear-gradient(135deg,#fdf2f8,#fce7f3);border-color:#f9a8d4}
.panel.pk h3{color:#be185d}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;font-size:12.5px;font-weight:500;background:#fff;border:1px solid #e2e8f0;border-radius:20px;color:#475569}
.chip em{font-style:normal;color:#94a3b8}
.chip.x button{background:#fee2e2;border:none;color:#dc2626;cursor:pointer;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:700}
.btn-chip{cursor:pointer}
.btn-chip.off{background:#f1f5f9;color:#94a3b8;text-decoration:line-through}
.muted{color:#94a3b8}
.sm{font-size:12px}
.y-text{color:#d97706}
.note{font-size:12.5px;border-radius:11px;padding:11px 14px;margin:10px 0;line-height:1.6}
.note.g{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.note.y{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.note.gray{background:#f8fafc;color:#475569;border:1px solid #e2e8f0}
.statbar{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.stat{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;background:#f1f5f9;color:#475569}
.stat em{font-style:normal;opacity:.7;font-weight:500}
.stat.p{background:#f5f3ff;color:#6d28d9}
.stat.g{background:#f0fdf4;color:#16a34a}
.stat.y{background:#fffbeb;color:#b45309}
.stat.r{background:#fef2f2;color:#dc2626}
.picker{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow-y:auto;padding:10px;background:#f8fafc;border-radius:10px}
.picker.g{background:#f0fdf4}.picker.b{background:#eff6ff}
.picker.y{background:#fffbeb}.picker.pk{background:#fdf2f8}
.pchip{padding:6px 13px;font-size:12.5px;font-weight:600;background:#fff;border:1px solid #e2e8f0;border-radius:16px;cursor:pointer;color:#475569}
.pchip:hover{border-color:var(--pp);color:var(--pp-d)}
.zone-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt-cards{display:grid;gap:8px}
.opt-card{text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:11px;background:#fff;cursor:pointer}
.opt-card.on{border-color:var(--pp);background:#f5f3ff}
.opt-card strong{display:block;font-size:13.5px}
.opt-card em{display:block;font-size:11.5px;color:var(--mut);font-style:normal;margin-top:3px}
.plist{display:grid;gap:8px;margin-top:8px}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:12px 14px;flex-wrap:wrap}
.pitem strong{font-size:14px}
.pitem em{display:block;font-size:11.5px;color:var(--mut);font-style:normal;margin-top:2px}
.pbtns{display:flex;gap:6px}
.teacher-banner{background:linear-gradient(135deg,#1e293b,#334155);color:#e2e8f0;font-size:13px;line-height:1.6;border-radius:13px;padding:14px 17px;margin-bottom:20px}
.teacher-banner strong{color:#fff}
.teacher-banner u{color:#fde047;text-decoration-color:#fde047}

/* ---------- 좌석 ---------- */
.scroll-x{overflow-x:auto;padding-bottom:6px}
.seat-grid{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:min-content;margin:0 auto}
.seat-row{display:flex;gap:8px;justify-content:center}
.aisle{width:24px;flex:none}
.seat{width:var(--sw);height:var(--sh);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:linear-gradient(135deg,#f3e8ff,#e9d5ff);border:2px solid #d8b4fe;flex:none;position:relative;transition:transform .15s}
.seat .sname{font-size:var(--sf);font-weight:700;color:#5b21b6;line-height:1.15;text-align:center;word-break:keep-all;padding:0 3px}
.seat .sname.tiny{font-size:11px}
.seat .sx{font-size:11px;color:#94a3b8}
.seat .sbadge{font-size:9px;line-height:1}
.seat.empty{background:#f8fafc;border:2px dashed #cbd5e1}
.seat.off{background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 6px,#e2e8f0 6px,#e2e8f0 12px);border:2px solid #e2e8f0}
.seat.off .sx{color:#cbd5e1}
.seat.pickable{background:#faf5ff;border:2px solid #d8b4fe;cursor:pointer}
.seat.m-fixed{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#86efac}
.seat.m-fixed .sname{color:#166534}
.seat.m-sep{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#fcd34d}
.seat.m-sep .sname{color:#92400e}
.seat.m-tog{background:linear-gradient(135deg,#fce7f3,#fbcfe8);border-color:#f9a8d4}
.seat.m-tog .sname{color:#9d174d}
.seat.m-zone{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border-color:#93c5fd}
.seat.m-zone .sname{color:#1e40af}
.seat.sel{outline:4px solid #f59e0b;outline-offset:2px;transform:scale(1.06);z-index:2}
.seat-grid.mini{--sw:62px;--sh:46px;--sf:11px;gap:6px}
.seat-grid.mini .seat-row{gap:6px}
.seat-grid.mini .aisle{width:16px}
.seat-grid.plain .seat{background:linear-gradient(135deg,#f3e8ff,#e9d5ff);border-color:#d8b4fe}
.seat-grid.plain .seat .sname{color:#5b21b6}
.seat-grid.plain .seat.empty{background:#f8fafc;border:2px dashed #cbd5e1}
.seat[role=button]{cursor:pointer}
.seat[role=button]:hover{transform:translateY(-2px)}
.hidden-seat{background:linear-gradient(135deg,#ede9fe,#e0e7ff)!important;border-style:dashed!important}
.hidden-seat .sq{font-size:calc(var(--sf) * 1.1);color:#c4b5fd;font-weight:800}
.pop{animation:popIn .38s cubic-bezier(.2,1.2,.4,1) both}
.board{display:block;width:max-content;margin:0 auto 18px;background:linear-gradient(135deg,var(--pp),var(--pp2));color:#fff;padding:11px 42px;border-radius:10px;font-weight:700;font-size:14px;letter-spacing:2px}
.board.big{padding:16px 70px;font-size:clamp(16px,2.4vw,26px);margin-bottom:22px}
.mini-board{display:block;width:max-content;margin:0 auto 12px;background:linear-gradient(135deg,var(--pp),var(--pp2));color:#fff;padding:5px 24px;border-radius:6px;font-weight:600;font-size:11px}
.side-labels{display:flex;justify-content:space-between;max-width:640px;margin:14px auto 0;font-size:11.5px;color:#94a3b8}
.legend{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px;margin-top:22px;padding-top:18px;border-top:1px solid #e2e8f0;font-size:12px;color:var(--mut)}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:17px;height:17px;border-radius:5px;display:inline-block;border:2px solid}
.sw.m-fixed{background:#bbf7d0;border-color:#86efac}
.sw.m-sep{background:#fde68a;border-color:#fcd34d}
.sw.m-tog{background:#fbcfe8;border-color:#f9a8d4}
.sw.m-zone{background:#bfdbfe;border-color:#93c5fd}
.lg-note{font-size:11px;color:#a1a1aa}

/* ---------- 결과 ---------- */
.present-cta{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.btn-present{flex:1;min-width:260px;display:flex;align-items:center;gap:14px;padding:16px 22px;border:none;border-radius:16px;cursor:pointer;text-align:left;color:#fff;background:linear-gradient(135deg,#0f172a,#4c1d95 60%,#7c3aed);box-shadow:0 12px 34px rgba(76,29,149,.35)}
.btn-present:hover{filter:brightness(1.1)}
.btn-present.sm{min-width:0;padding:12px 18px;font-size:13px}
.bp-ico{font-size:26px}
.bp-txt strong{display:block;font-size:16px;font-weight:800}
.bp-txt em{display:block;font-size:11.5px;font-style:normal;opacity:.78;margin-top:3px}
.btn-note{font-size:12px;color:var(--mut);text-align:center;margin-top:12px;line-height:1.7}
.btn-note strong{color:#7c3aed}
.alt-run{margin-top:20px;padding-top:18px;border-top:1px dashed #e4e4e7;text-align:center}
.alt-run p{font-size:11.5px;color:var(--mut);margin-top:8px}
.startcard{background:linear-gradient(150deg,#1e1b4b,#312e81 55%,#4c1d95);color:#e9e6ff;border-radius:24px;padding:clamp(44px,8vw,88px) clamp(20px,4vw,44px);text-align:center;box-shadow:0 24px 70px rgba(30,27,75,.35)}
.start-ico{font-size:clamp(44px,7vw,64px);margin-bottom:clamp(22px,4vw,34px);animation:float 5s ease-in-out infinite}
.btn-start{font-size:clamp(20px,3.6vw,30px);font-weight:900;letter-spacing:-.5px;color:#312e81;background:linear-gradient(135deg,#fff,#ede9fe);border:none;border-radius:100px;padding:clamp(20px,3vw,28px) clamp(44px,8vw,84px);cursor:pointer;box-shadow:0 14px 44px rgba(0,0,0,.32);transition:transform .15s,box-shadow .15s;max-width:100%}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 20px 54px rgba(0,0,0,.4)}
.btn-start:active{transform:translateY(0)}
.start-meta{font-size:14px;color:rgba(233,230,255,.62);margin-top:clamp(20px,3vw,28px);font-weight:500}
.start-links{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:clamp(30px,5vw,44px);padding-top:20px;border-top:1px solid rgba(255,255,255,.12)}
.start-links button{background:none;border:none;color:rgba(233,230,255,.5);font-size:12.5px;cursor:pointer;padding:4px 2px}
.start-links button:hover{color:#fff;text-decoration:underline}
.exposed{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fef2f2;border:1px solid #fecaca;border-left:5px solid #ef4444;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:#991b1b}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:11px 20px;font-size:13px;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:10px;color:#71717a;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--pp),var(--pp2));color:#fff;border-color:transparent}
.tab.on.c{background:linear-gradient(135deg,#06b6d4,#0891b2)}
.tab.on.g{background:linear-gradient(135deg,#10b981,#059669)}
.issues{background:#fff;border:1px solid #fde68a;border-left:5px solid #f59e0b;border-radius:13px;padding:16px 18px;margin-bottom:16px}
.issues h4{font-size:14px;margin-bottom:9px}
.issues h4 span{font-size:11px;color:var(--mut);font-weight:500}
.iss{font-size:13px;color:#475569;padding:4px 0}
.iss.w{color:#b45309}
.iss.ok{color:#16a34a}
.iss-tip{font-size:11.5px;color:var(--mut);margin-top:8px}
.sheet{background:#fff;border-radius:20px;padding:clamp(18px,3vw,34px);box-shadow:0 20px 60px rgba(0,0,0,.08)}
.sheet.mt{margin-top:18px}
.sheet-head{text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:3px solid var(--pp)}
.sheet-head.row{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:14px;flex-wrap:wrap;border-bottom-color:#10b981}
.sheet-head h2{font-size:clamp(19px,3vw,25px);font-weight:800}
.sheet-head p{font-size:12.5px;color:var(--mut);margin-top:5px}
.hbtns{display:flex;gap:8px}
.view-badge{text-align:center;margin-bottom:14px;font-size:12.5px;font-weight:700;color:#7c3aed}
.swap-tip{text-align:center;font-size:11.5px;color:#a1a1aa;margin-bottom:12px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.group{border:2px solid;border-radius:14px;padding:16px;min-height:116px;transition:transform .18s}
.group.target{cursor:pointer;box-shadow:0 0 0 3px rgba(34,197,94,.35)}
.group.over{transform:scale(1.02)}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.ghead h3{font-size:15px;font-weight:700}
.ghead span{font-size:12px;font-weight:600;opacity:.72}
.gmem{display:flex;flex-wrap:wrap;gap:6px;min-height:42px}
.gchip{padding:7px 13px;font-size:12.5px;font-weight:600;background:#fff;border:1px solid;border-radius:20px;cursor:pointer;user-select:none}
.gchip.picked{outline:3px solid #f59e0b;outline-offset:1px}
.gfoot{margin-top:16px;text-align:center}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;overflow-y:auto}
.modal-box{background:#fff;border-radius:20px;width:100%;max-height:92vh;display:flex;flex-direction:column;animation:popIn .22s ease}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 24px 14px;border-bottom:1px solid #f1f5f9}
.modal-head h3{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.modal-head .mi{width:34px;height:34px;background:#f5f3ff;border-radius:9px;display:flex;align-items:center;justify-content:center}
.modal-head .sub{font-size:12.5px;color:var(--mut);margin-top:6px}
.modal-head .x{background:#f1f5f9;border:none;width:32px;height:32px;border-radius:9px;cursor:pointer;color:#64748b;flex:none}
.modal-body{padding:20px 24px;overflow-y:auto}
.modal-foot{padding:14px 24px 20px;border-top:1px solid #f1f5f9}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:13.5px;padding:14px 22px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.3);z-index:2000;max-width:min(92vw,520px);line-height:1.5;animation:toastIn .25s ease}

/* ---------- 공개 모드 ---------- */
.present{position:fixed;inset:0;z-index:3000;background:radial-gradient(circle at 50% 0%,#312e81,#1e1b4b 45%,#0f0a24);color:#fff;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.p-top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;flex:none}
.p-title{font-size:clamp(16px,2.4vw,24px);font-weight:800;display:flex;align-items:baseline;gap:12px}
.p-sub{font-size:13px;opacity:.6;font-weight:500}
.p-actions{display:flex;gap:8px}
.p-btn{padding:10px 18px;font-size:13px;font-weight:700;border:none;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;cursor:pointer}
.p-btn.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.p-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;min-height:0}
.p-grid-wrap{max-width:100%;overflow:auto}
.p-side{width:100%;max-width:700px}
.p-side .side-labels{color:rgba(255,255,255,.45);margin-top:14px}
.present .board{box-shadow:0 10px 30px rgba(124,58,237,.5)}
.present .seat{background:linear-gradient(135deg,#ffffff,#f1f5f9)!important;border-color:#c4b5fd!important;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.present .seat .sname{color:#312e81!important;font-weight:800}
.present .seat.empty{background:rgba(255,255,255,.07)!important;border:2px dashed rgba(255,255,255,.22)!important;box-shadow:none}
.present .seat.empty .sx{color:rgba(255,255,255,.3)}
.present .seat.off{background:rgba(255,255,255,.03)!important;border:2px solid rgba(255,255,255,.1)!important;box-shadow:none}
.present .seat.off .sx{color:rgba(255,255,255,.2)}
.present .hidden-seat{background:rgba(255,255,255,.1)!important;border:2px dashed rgba(255,255,255,.3)!important;box-shadow:none}
.present .hidden-seat .sq{color:rgba(255,255,255,.5)}
.p-bottom{flex:none;height:52px;display:flex;align-items:center;justify-content:center}
.p-hint{font-size:13px;color:rgba(255,255,255,.45)}
.p-hint.done{font-size:clamp(15px,2.2vw,22px);color:#fde047;font-weight:700}
.countdown{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.cd-ring{position:absolute;width:min(46vh,46vw);height:min(46vh,46vw);border-radius:50%;border:6px solid rgba(167,139,250,.5);animation:ring 1s ease-out infinite}
.cd-num{font-size:min(40vh,40vw);font-weight:900;line-height:1;background:linear-gradient(135deg,#fde047,#fb923c,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:cdIn .9s ease both}
.cd-msg{margin-top:20px;font-size:clamp(15px,2.4vw,22px);color:rgba(255,255,255,.62);font-weight:600}
.p-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,90vw),1fr));gap:16px;width:100%;max-width:1200px;max-height:100%;overflow:auto}
.p-group{border:3px solid;border-radius:16px;padding:18px}
.p-group h3{font-size:clamp(16px,2vw,22px);font-weight:800;margin-bottom:10px}
.p-gm{display:flex;flex-wrap:wrap;gap:8px}
.p-gm span{background:#fff;border:2px solid;padding:8px 16px;border-radius:20px;font-size:clamp(13px,1.6vw,19px);font-weight:700}
.p-gm .q{background:transparent;border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.5)}
.p-group.hidden-seat{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.25)!important}
.p-group.hidden-seat h3{color:rgba(255,255,255,.55)!important}

/* ---------- 인쇄 ---------- */
@media print{
  @page{margin:12mm}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body *{visibility:hidden!important}
  #printArea,#printArea *{visibility:visible!important}
  #printArea{position:absolute!important;left:0;top:0;width:100%;box-shadow:none!important;padding:0!important;border-radius:0!important}
  .no-print{display:none!important}
  .scroll-x{overflow:visible!important}
}

/* ---------- 반응형 ---------- */
@media (max-width:640px){
  .seat-grid{--sw:66px;--sh:54px;--sf:12px;gap:6px}
  .seat-row{gap:6px}
  .aisle{width:14px}
  .btn{padding:11px 14px;font-size:13px}
  .actions .btn{flex:1 1 calc(50% - 8px)}
}

<script>
/* ============================================================
   교실 자리 배치 시스템 v2.0 — 배치 엔진 / 유틸리티
   ============================================================ */

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

/* --- Fisher-Yates 셔플 (균등 분포) --- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const key = (r, c) => r + '-' + c;
const unkey = k => {
  const [r, c] = k.split('-').map(Number);
  return {
    r,
    c
  };
};

/* --- 분단(섹션) 계산 --- */
const sectionOf = (c, aisleEvery) => aisleEvery > 0 ? Math.floor(c / aisleEvery) : 0;
const sectionCount = (cols, aisleEvery) => aisleEvery > 0 ? Math.ceil(cols / aisleEvery) : 1;

/* --- 짝꿍(같은 책상 옆자리) 판정: 같은 행 + 바로 옆 + 같은 분단 --- */
function isDeskmate(a, b, aisleEvery) {
  if (a.r !== b.r) return false;
  if (Math.abs(a.c - b.c) !== 1) return false;
  return sectionOf(a.c, aisleEvery) === sectionOf(b.c, aisleEvery);
}

/* --- 통로를 고려한 좌석 거리 (통로 1개 건널 때마다 +0.8) --- */
function seatDistance(a, b, aisleEvery) {
  const dr = Math.abs(a.r - b.r);
  const dc = Math.abs(a.c - b.c);
  const aisles = aisleEvery > 0 ? Math.abs(sectionOf(a.c, aisleEvery) - sectionOf(b.c, aisleEvery)) : 0;
  const eff = dc + aisles * 0.8;
  return Math.sqrt(dr * dr + eff * eff);
}

/* --- 앞/중간/뒤 구역 밴드 --- */
function bandOf(r, rows) {
  if (rows <= 2) return r === 0 ? 'front' : 'back';
  if (r < rows / 3) return 'front';
  if (r < rows * 2 / 3) return 'mid';
  return 'back';
}

/* ============================================================
   명단 파싱
   ============================================================ */
function parseRoster(text, prevStudents) {
  const prev = {};
  (prevStudents || []).forEach(s => {
    prev[(s.num ?? '') + '|' + s.name] = s;
  });
  const tokens = text.split(/[\n,;·]+/).map(s => s.trim()).filter(Boolean);
  const seen = {};
  return tokens.map(t => {
    let num = null;
    let name = t;
    const m = t.match(/^(\d{1,3})\s*[.)\-:\t]?\s*(\S.*)$/);
    if (m && m[2].trim()) {
      num = parseInt(m[1], 10);
      name = m[2].trim();
    }
    name = name.replace(/\s+/g, ' ');
    const k = (num ?? '') + '|' + name;
    const reuse = prev[k] && !seen[k] ? prev[k] : null;
    seen[k] = true;
    return reuse ? {
      id: reuse.id,
      num,
      name,
      excluded: !!reuse.excluded
    } : {
      id: uid(),
      num,
      name,
      excluded: false
    };
  });
}

/* --- 동명이인 대응 표시 이름 --- */
function buildLabels(students) {
  const cnt = {};
  students.forEach(s => {
    cnt[s.name] = (cnt[s.name] || 0) + 1;
  });
  const used = {};
  const map = {};
  students.forEach(s => {
    if (cnt[s.name] > 1) {
      used[s.name] = (used[s.name] || 0) + 1;
      map[s.id] = s.num != null ? s.num + ' ' + s.name : s.name + '(' + used[s.name] + ')';
    } else {
      map[s.id] = s.name;
    }
  });
  return map;
}

/* ============================================================
   좌석 목록 / 구역
   ============================================================ */
function buildSeatList(cfg) {
  const list = [];
  for (let r = 0; r < cfg.rows; r++) {
    for (let c = 0; c < cfg.cols; c++) {
      if (cfg.disabled.indexOf(key(r, c)) >= 0) continue;
      list.push({
        r,
        c
      });
    }
  }
  return list;
}
const ZONE_LABELS = {
  row1: '맨 앞줄',
  front: '앞쪽 (1~2행)',
  mid: '가운데',
  back: '뒤쪽',
  window: '창가 쪽',
  hall: '복도 쪽'
};
function zoneOptions(cfg) {
  const opts = Object.keys(ZONE_LABELS).map(k => ({
    v: k,
    label: ZONE_LABELS[k]
  }));
  const n = sectionCount(cfg.cols, cfg.aisleEvery);
  if (n > 1) for (let i = 0; i < n; i++) opts.push({
    v: 'section:' + i,
    label: i + 1 + '분단'
  });
  return opts;
}
function zoneLabel(z, cfg) {
  if (z && z.indexOf('section:') === 0) return Number(z.split(':')[1]) + 1 + '분단';
  return ZONE_LABELS[z] || z;
}
function seatsInZone(zone, cfg, seats) {
  const {
    rows,
    cols,
    aisleEvery,
    windowSide
  } = cfg;
  const leftIsWindow = windowSide !== 'right';
  if (zone === 'row1') return seats.filter(s => s.r === 0);
  if (zone === 'front') return seats.filter(s => s.r <= Math.min(1, rows - 1));
  if (zone === 'back') return seats.filter(s => s.r >= Math.max(0, rows - 2));
  if (zone === 'mid') return seats.filter(s => bandOf(s.r, rows) === 'mid');
  if (zone === 'window') return seats.filter(s => leftIsWindow ? s.c <= 1 : s.c >= cols - 2);
  if (zone === 'hall') return seats.filter(s => leftIsWindow ? s.c >= cols - 2 : s.c <= 1);
  if (zone && zone.indexOf('section:') === 0) {
    const n = Number(zone.split(':')[1]);
    return seats.filter(s => sectionOf(s.c, aisleEvery) === n);
  }
  return seats;
}

/* ============================================================
   사용할 좌석 선택 (빈자리 위치 정책)
   ============================================================ */
function orderByRow(seats, dir) {
  const byRow = {};
  seats.forEach(s => {
    (byRow[s.r] = byRow[s.r] || []).push(s);
  });
  const keys = Object.keys(byRow).map(Number).sort((a, b) => dir === 'asc' ? a - b : b - a);
  let out = [];
  keys.forEach(r => {
    out = out.concat(shuffle(byRow[r]));
  });
  return out;
}
function chooseUsedSeats(seats, need, policy, mustKeep) {
  if (need >= seats.length) return seats.slice();
  const keep = seats.filter(s => mustKeep.has(key(s.r, s.c)));
  const rest = seats.filter(s => !mustKeep.has(key(s.r, s.c)));
  const extra = need - keep.length;
  if (extra <= 0) return keep.slice(0, Math.max(need, keep.length));
  let ordered;
  if (policy === 'front') ordered = orderByRow(rest, 'desc'); // 빈자리를 앞쪽에
  else if (policy === 'spread') ordered = shuffle(rest); // 무작위 분산
  else ordered = orderByRow(rest, 'asc'); // 기본: 빈자리를 뒤쪽에
  return keep.concat(ordered.slice(0, extra));
}

/* ============================================================
   후보 배치 생성
   ============================================================ */
function attempt(cfg, ctx) {
  const map = {};
  const placed = new Set();

  // 1) 고정 자리 (하드 제약)
  Object.keys(ctx.fixedMap).forEach(id => {
    if (!ctx.activeIds.has(id)) return;
    map[ctx.fixedMap[id]] = id;
    placed.add(id);
  });
  const freeSeats = () => ctx.usedSeats.filter(s => !map[key(s.r, s.c)]);

  // 2) 구역 지정 학생
  shuffle(Object.keys(ctx.zoneMap).filter(id => ctx.activeIds.has(id) && !placed.has(id))).forEach(id => {
    const cands = shuffle(seatsInZone(ctx.zoneMap[id], cfg, freeSeats()));
    if (cands.length) {
      map[key(cands[0].r, cands[0].c)] = id;
      placed.add(id);
    }
  });

  // 3) 짝으로 붙일 쌍
  shuffle(ctx.togetherPairs).forEach(p => {
    if (!ctx.activeIds.has(p.a) || !ctx.activeIds.has(p.b)) return;
    if (placed.has(p.a) && placed.has(p.b)) return;
    const free = freeSeats();
    if (placed.has(p.a) || placed.has(p.b)) {
      const anchorId = placed.has(p.a) ? p.a : p.b;
      const otherId = placed.has(p.a) ? p.b : p.a;
      const ak = Object.keys(map).filter(k => map[k] === anchorId)[0];
      if (!ak) return;
      const A = unkey(ak);
      const spot = shuffle(free).filter(s => isDeskmate(A, s, cfg.aisleEvery))[0];
      if (spot) {
        map[key(spot.r, spot.c)] = otherId;
        placed.add(otherId);
      }
      return;
    }
    const opts = [];
    free.forEach(s => free.forEach(t => {
      if (s.c < t.c && isDeskmate(s, t, cfg.aisleEvery)) opts.push([s, t]);
    }));
    if (opts.length) {
      const pick = opts[Math.floor(Math.random() * opts.length)];
      map[key(pick[0].r, pick[0].c)] = p.a;
      map[key(pick[1].r, pick[1].c)] = p.b;
      placed.add(p.a);
      placed.add(p.b);
    }
  });

  // 4) 나머지 무작위
  const rest = shuffle(Array.from(ctx.activeIds).filter(id => !placed.has(id)));
  const free = shuffle(freeSeats());
  rest.forEach((id, i) => {
    if (free[i]) map[key(free[i].r, free[i].c)] = id;
  });
  return map;
}

/* ============================================================
   점수 계산 — 제약 위반이 적을수록 높은 점수
   ============================================================ */
function scoreMap(map, cfg, ctx, collect) {
  const pos = {};
  const keys = Object.keys(map);
  keys.forEach(k => {
    const p = unkey(k);
    pos[map[k]] = p;
  });
  let s = 0;
  const issues = collect ? [] : null;
  const A = cfg.aisleEvery;

  // 떨어뜨릴 쌍
  ctx.separatePairs.forEach(p => {
    const P = pos[p.a];
    const Q = pos[p.b];
    if (!P || !Q) return;
    const dr = Math.abs(P.r - Q.r);
    const dc = Math.abs(P.c - Q.c);
    const d = seatDistance(P, Q, A);
    if (isDeskmate(P, Q, A)) {
      s -= 400;
      if (issues) issues.push({
        t: 'sep',
        a: p.a,
        b: p.b,
        msg: '짝으로 배정됨'
      });
    } else if (dr === 1 && dc === 0) {
      s -= 250;
      if (issues) issues.push({
        t: 'sep',
        a: p.a,
        b: p.b,
        msg: '바로 앞뒤 자리'
      });
    } else if (dr <= 1 && dc <= 1) {
      s -= 150;
      if (issues) issues.push({
        t: 'sep',
        a: p.a,
        b: p.b,
        msg: '대각선 인접'
      });
    } else if (d < 2.6) {
      s -= 60;
      if (issues) issues.push({
        t: 'sep-near',
        a: p.a,
        b: p.b,
        msg: '다소 가까움'
      });
    }
    s += Math.min(d, 7) * 5;
  });

  // 붙여 앉힐 쌍
  ctx.togetherPairs.forEach(p => {
    const P = pos[p.a];
    const Q = pos[p.b];
    if (!P || !Q) return;
    if (isDeskmate(P, Q, A)) s += 200;else if (Math.abs(P.r - Q.r) <= 1 && Math.abs(P.c - Q.c) <= 1) s += 40;else {
      s -= 150;
      if (issues) issues.push({
        t: 'tog',
        a: p.a,
        b: p.b,
        msg: '짝으로 배정하지 못함'
      });
    }
  });

  // 구역 지정
  Object.keys(ctx.zoneMap).forEach(id => {
    const P = pos[id];
    if (!P) return;
    const ok = seatsInZone(ctx.zoneMap[id], cfg, [P]).length > 0;
    if (!ok) {
      s -= 250;
      if (issues) issues.push({
        t: 'zone',
        a: id,
        msg: zoneLabel(ctx.zoneMap[id], cfg) + ' 배정 실패'
      });
    }
  });

  // 이력 반영
  if (ctx.avoidSamePartner || ctx.avoidSameZone) {
    keys.forEach(k => {
      const P = unkey(k);
      const id = map[k];
      if (ctx.avoidSamePartner) {
        const rk = key(P.r, P.c + 1);
        const nb = map[rk];
        if (nb && isDeskmate(P, {
